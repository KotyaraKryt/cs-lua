name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Юниты на core/ и include/. Игры не нужно: движковые пространства имён
  # подменяются стабами, поэтому job секундный и стоит первым - падать на
  # разрешении прав дешевле до сборки, чем после.
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run
        run: luajit tests/run.lua

  windows:
    needs: tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # LuaJIT is built in place and linked statically, so this has to happen
      # before cmake - which refuses to configure without lua51.lib.
      - name: Build LuaJIT (x86, static)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd third_party\luajit\src
          call msvcbuild.bat static

      - name: Configure
        run: cmake -S . -B build -A Win32 -DCSLUA_SERVER_DIR=

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v5
        with:
          name: lua_mm-x86
          path: build/Release/lua_mm.dll
          if-no-files-found: error

  linux:
    needs: tests
    runs-on: ubuntu-latest

    # Deliberately an old distro. A module linked against a current glibc asks
    # for symbol versions (GLIBC_2.38 and friends) that the boxes CS servers
    # actually run on do not have, and it refuses to load there. Debian 11 puts
    # the floor at glibc 2.31, which covers everything still in service.
    container: debian:11

    steps:
      # GoldSrc is 32-bit, so everything down to libstdc++ has to be.
      - name: Install the 32-bit toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib \
            git ca-certificates curl file make
          # Debian 11 ships cmake 3.18 and the project asks for 3.20.
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local

      # After git is installed, or the submodules do not come down.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # -fPIC matters: the stock static objects are position-dependent, and
      # they cannot be linked into a shared object.
      - name: Build LuaJIT (x86, static, PIC)
        run: |
          make -C third_party/luajit/src \
            CC="gcc -m32" BUILDMODE=static TARGET_CFLAGS=-fPIC -j"$(nproc)"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCSLUA_SERVER_DIR=

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # A module that pulls in a symbol the engine does not provide loads fine
      # and dies later, so check the file is what it claims to be and that
      # nothing is left dangling.
      - name: Check the module
        run: |
          file build/lua_mm_i386.so
          file build/lua_mm_i386.so | grep -q "ELF 32-bit" \
            || { echo "not a 32-bit ELF"; exit 1; }
          echo "--- undefined symbols ---"
          nm -D --undefined-only build/lua_mm_i386.so | head -40
          echo "--- exported plugin API ---"
          nm -D --defined-only build/lua_mm_i386.so \
            | grep -E "GiveFnptrsToDll|Meta_(Query|Attach|Detach)|GetEntityAPI2" \
            || { echo "plugin entry points are missing"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: lua_mm-linux-x86
          path: build/lua_mm_i386.so
          if-no-files-found: error

  # CI artifacts expire, release assets do not - so on a version tag the same
  # binaries get attached to the release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lua_mm.dll
            artifacts/lua_mm_i386.so
          fail_on_unmatched_files: true
