name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # LuaJIT is built in place and linked statically, so this has to happen
      # before cmake - which refuses to configure without lua51.lib.
      - name: Build LuaJIT (x86, static)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd third_party\luajit\src
          call msvcbuild.bat static

      - name: Configure
        run: cmake -S . -B build -A Win32 -DCSLUA_SERVER_DIR=

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v5
        with:
          name: lua_mm-x86
          path: build/Release/lua_mm.dll
          if-no-files-found: error
