name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Юниты на core/ и include/. Игры не нужно: движковые пространства имён
  # подменяются стабами, поэтому job секундный и стоит первым - падать на
  # разрешении прав дешевле до сборки, чем после.
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run
        run: luajit tests/run.lua

  windows:
    needs: tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # LuaJIT is built in place and linked statically, so this has to happen
      # before cmake - which refuses to configure without lua51.lib.
      - name: Build LuaJIT (x86, static)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd third_party\luajit\src
          call msvcbuild.bat static

      - name: Configure
        run: cmake -S . -B build -A Win32 -DCSLUA_SERVER_DIR=

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@v5
        with:
          name: lua_mm-x86
          path: build/Release/lua_mm.dll
          if-no-files-found: error

  linux:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Deliberately an old distro to compile against - and deliberately not
      # this job's own `container:`, because actions/checkout and everything
      # else GitHub runs here needs a Node.js new enough to want a newer
      # glibc than the target distro ships, which made the container itself
      # unable to run the actions that populate it. So checkout happens on
      # the normal runner above, and only the compile step below runs inside
      # the old image, driven by hand through `docker run`.
      #
      # A module linked against a current glibc asks for symbol versions
      # (GLIBC_2.38 and friends) that the boxes CS servers actually run on do
      # not have, and it refuses to load there with a dlopen error, not a
      # build error - so the floor has to be picked low up front, not caught
      # by any check here. Debian 11 (glibc 2.31) was the original floor and
      # it was not old enough: a real host still in service came back with
      # "libpthread.so.0: version `GLIBC_2.30' not found". Ubuntu 18.04 puts
      # the floor at glibc 2.27.
      - name: Build inside ubuntu:18.04 (glibc 2.27 floor)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:18.04 bash -c '
            set -e
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential gcc-multilib g++-multilib curl ca-certificates file make
            # 18.04 ships cmake 3.10 and the project asks for 3.20.
            curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-x86_64.tar.gz \
              | tar xz --strip-components=1 -C /usr/local

            # -fPIC matters: the stock static objects are position-dependent,
            # and they cannot be linked into a shared object.
            make -C third_party/luajit/src \
              CC="gcc -m32" BUILDMODE=static TARGET_CFLAGS=-fPIC -j"$(nproc)"

            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCSLUA_SERVER_DIR=
            cmake --build build -j"$(nproc)"

            # MariaDB/MySQL do not publish a 32-bit Linux client build at all
            # (only amd64/aarch64 on the connector download page), and a host
            # on FTP-only shared hosting has no apt of its own to get one from
            # either - so this pulls the i386 .deb straight from Ubuntu 18.04s
            # own repos (no install, no runtime dependency on it existing on
            # this box) and hands over just the .so, for lua_mysql.cpp addons/lua
            # fallback path to pick up once dropped there by hand.
            dpkg --add-architecture i386
            apt-get update
            apt-get download libmysqlclient20:i386
            mkdir -p /work/dist/mysql-lib
            dpkg-deb -x ./libmysqlclient20*.deb /tmp/mysql-extract
            find /tmp/mysql-extract -name "libmysqlclient.so*" -exec cp -a {} /work/dist/mysql-lib/ \;
          '

      # A module that pulls in a symbol the engine does not provide loads fine
      # and dies later, so check the file is what it claims to be and that
      # nothing is left dangling. Runs on the normal runner, not the old
      # image - file/nm here are only inspecting the result, not running it.
      - name: Check the module
        run: |
          file build/lua_mm_i386.so
          file build/lua_mm_i386.so | grep -q "ELF 32-bit" \
            || { echo "not a 32-bit ELF"; exit 1; }
          echo "--- undefined symbols ---"
          nm -D --undefined-only build/lua_mm_i386.so | head -40
          echo "--- exported plugin API ---"
          nm -D --defined-only build/lua_mm_i386.so \
            | grep -E "GiveFnptrsToDll|Meta_(Query|Attach|Detach)|GetEntityAPI2" \
            || { echo "plugin entry points are missing"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: lua_mm-linux-x86
          path: build/lua_mm_i386.so
          if-no-files-found: error

      # Only needed by scripts/plugins using db.mysql() (lua_mysql.cpp) - not
      # required to run the module at all, so a missing file here does not
      # fail the job.
      - uses: actions/upload-artifact@v5
        with:
          name: mysql-client-lib-i386
          path: dist/mysql-lib/
          if-no-files-found: warn

  # CI artifacts expire, release assets do not - so on a version tag the same
  # binaries get attached to the release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lua_mm.dll
            artifacts/lua_mm_i386.so
          fail_on_unmatched_files: true
