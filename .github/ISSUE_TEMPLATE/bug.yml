name: Баг
description: Модуль падает, ведёт себя не так, как написано в доках
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Вопрос «как сделать X» — не сюда, а в
        [Обсуждения](https://github.com/KotyaraKryt/cs-lua/discussions).

  - type: textarea
    id: what
    attributes:
      label: Что происходит
      description: И что ожидалось вместо этого.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Минимальный плагин, который это воспроизводит
      description: Десять строк лучше, чем весь мод.
      render: lua
    validations:
      required: true

  - type: textarea
    id: startup
    attributes:
      label: Что модуль напечатал при старте
      description: >
        Строки `[cs-lua]` из консоли сервера. Там видно версию модуля и
        подключились ли ReGameDLL и ReHLDS API.
      render: text
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Ошибка из консоли
      description: Целиком, вместе с трейсбеком.
      render: text

  - type: textarea
    id: lualist
    attributes:
      label: Вывод lua_list
      description: Видно, какие плагины загрузились и нет ли среди них `[FAILED]`.
      render: text

  - type: input
    id: server
    attributes:
      label: Сервер
      placeholder: ReHLDS 3.13, ReGameDLL 5.26, metamod-r 1.3.0.149
    validations:
      required: true
